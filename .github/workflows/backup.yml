# Backup semanal da base de dados (tarefa 2.7).
# O plano grátis do Supabase não faz backups. Isto faz um pg_dump, cifra-o e guarda-o
# como artifact privado do GitHub durante 30 dias.
#
# Secrets a criar em GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_DB_URL    connection string do "Session pooler" (Supabase → Connect).
#                      A ligação direta é IPv6 e os runners do GitHub não lá chegam.
#   BACKUP_PASSPHRASE  frase longa e aleatória. Guarda-a fora do GitHub (sem ela o backup não abre).
#
# As fotos e imagens (Storage) NÃO estão incluídas, só a base de dados.
# Restauro: ver docs/DATABASE.md → Backups.

name: Backup semanal

on:
  schedule:
    - cron: "17 4 * * 0" # domingo, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PG_MAJOR: "17" # tem de ser >= à versão do Postgres do projeto (Supabase → Settings → Infrastructure)
    steps:
      - name: Verificar secrets
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::Falta o secret SUPABASE_DB_URL"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Falta o secret BACKUP_PASSPHRASE"; exit 1; }

      - name: Instalar pg_dump ${{ env.PG_MAJOR }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --retry 5 --retry-delay 3 --retry-all-errors \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq "postgresql-client-${PG_MAJOR}"

      - name: Fazer o dump
        run: |
          set -euo pipefail
          PGDUMP="/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump"
          STAMP="$(date -u +%Y-%m-%d)"
          mkdir -p "backup-${STAMP}"
          # Dados e schema da app
          "$PGDUMP" "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc \
            -f "backup-${STAMP}/public.dump"
          # Contas (só dados), para os UUIDs dos membros baterem certo num restauro
          "$PGDUMP" "$SUPABASE_DB_URL" --data-only --table=auth.users --no-owner -Fc \
            -f "backup-${STAMP}/auth-users.dump"
          tar -cf "backup-${STAMP}.tar" "backup-${STAMP}"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "backup-${STAMP}.tar.gpg" "backup-${STAMP}.tar"
          rm -rf "backup-${STAMP}" "backup-${STAMP}.tar"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Guardar (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: overlap-db-${{ env.STAMP }}
          path: backup-${{ env.STAMP }}.tar.gpg
          retention-days: 30
          if-no-files-found: error
